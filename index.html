<meta charset="UTF-8">
<title>여행 플래너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#faf6ef;
    --surface:#ffffff;
    --surface-2:#f2ece0;
    --ink:#211d1c;
    --ink-soft:#6b625a;
    --line:#e2d8c8;
    --accent:#b8402f;
    --accent-soft:#f0d9c9;
    --gold:#9c7a3f;
    --confirmed:#3f5a4a;
    --confirmed-soft:#e1ebe3;
    --upcoming:#9c7a3f;
    --upcoming-soft:#f2ece0;
    --ongoing:#2f6f8f;
    --ongoing-soft:#e2eef3;
    --done:#6b625a;
    --done-soft:#ece7dd;
    --danger:#b8402f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181d; --surface:#1f2228; --surface-2:#262a32;
      --ink:#ece6db; --ink-soft:#9a9186; --line:#3a3d44;
      --accent:#e07a63; --accent-soft:#3a2b26; --gold:#c9a35f;
      --confirmed:#8fbfa2; --confirmed-soft:#233229;
      --upcoming:#c9a35f; --upcoming-soft:#2c2820;
      --ongoing:#7fb8d8; --ongoing-soft:#1e2c34;
      --done:#9a9186; --done-soft:#2a2d33;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181d; --surface:#1f2228; --surface-2:#262a32;
    --ink:#ece6db; --ink-soft:#9a9186; --line:#3a3d44;
    --accent:#e07a63; --accent-soft:#3a2b26; --gold:#c9a35f;
    --confirmed:#8fbfa2; --confirmed-soft:#233229;
    --upcoming:#c9a35f; --upcoming-soft:#2c2820;
    --ongoing:#7fb8d8; --ongoing-soft:#1e2c34;
    --done:#9a9186; --done-soft:#2a2d33;
  }

  *{ box-sizing:border-box; }
  a{ color:var(--accent); }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.6; margin:0; padding:56px 20px 100px;
  }
  .page{ max-width:820px; margin:0 auto; }
  .nums{ font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }
  button{ font:inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  input, textarea, select{
    font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:9px 12px;
    width:100%;
  }
  label{ font-size:12.5px; color:var(--ink-soft); font-weight:700; display:block; margin-bottom:5px; }
  input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex; align-items:center; line-height:1.3; gap:6px;
    font-size:14px; font-weight:700; padding:9px 16px;
    border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff8f4; }
  .btn-primary:hover{ opacity:.92; border-color:var(--accent); }
  .btn-ghost{ border-color:transparent; background:none; color:var(--ink-soft); padding:6px 8px; }
  .btn-ghost:hover{ color:var(--accent); border-color:transparent; }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ font-size:12.5px; padding:6px 11px; border-radius:7px; }
  .btn-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---- Header ---- */
  header.top{
    display:flex; flex-direction:column; gap:16px;
    padding-bottom:32px; border-bottom:1px solid var(--line); margin-bottom:36px;
  }
  .eyebrow{ font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  h1{ font-family:"Noto Serif KR",serif; font-weight:700; font-size:clamp(28px,5vw,38px); margin:0; text-wrap:balance; letter-spacing:-.01em; }
  .subline{ color:var(--ink-soft); font-size:15px; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:16px; flex-wrap:wrap; }
  .section-head h2{ font-family:"Noto Serif KR",serif; font-size:21px; font-weight:700; margin:0; }
  .section-note{ font-size:13px; color:var(--ink-soft); }
  section{ margin-bottom:44px; }

  /* ---- Status pill ---- */
  .status{ display:inline-flex; align-items:center; line-height:1.3; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; padding:4px 10px; border-radius:999px; flex:0 0 auto; white-space:nowrap; }
  .status.upcoming{ color:var(--upcoming); background:var(--upcoming-soft); }
  .status.ongoing{ color:var(--ongoing); background:var(--ongoing-soft); }
  .status.completed{ color:var(--done); background:var(--done-soft); }
  .status.confirmed{ color:var(--confirmed); background:var(--confirmed-soft); }
  .status.open{ color:var(--gold); background:var(--surface-2); }

  /* ---- Empty state ---- */
  .empty{ text-align:center; padding:48px 20px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:14px; font-size:14.5px; }

  /* ---- Trip grid ---- */
  .trip-grid{ display:flex; flex-direction:column; gap:12px; }
  .trip-card{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; transition:border-color .15s ease, transform .15s ease;
  }
  .trip-card:hover{ border-color:var(--accent); transform:translateX(2px); }
  .trip-card-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .trip-card-title{ font-family:"Noto Serif KR",serif; font-weight:700; font-size:18px; }
  .trip-card-meta{ font-size:13.5px; color:var(--ink-soft); display:flex; gap:10px; flex-wrap:wrap; }

  /* ---- Trip header ---- */
  .trip-head{ display:flex; flex-direction:column; gap:14px; margin-bottom:32px; padding-bottom:28px; border-bottom:1px solid var(--line); }
  .trip-head-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .trip-head h1{ font-size:clamp(26px,4.5vw,34px); }
  .chips{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
  .chip{ font-size:13px; line-height:1.3; padding:6px 14px; border-radius:999px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); display:flex; align-items:center; gap:6px; }
  .chip b{ color:var(--accent); font-weight:700; }

  /* ---- Tabs ---- */
  .tabbar{ display:flex; align-items:center; gap:6px; border-bottom:1px solid var(--line); margin-bottom:28px; flex-wrap:wrap; }
  .tab{ display:inline-flex; align-items:center; line-height:1.3; background:none; border:none; padding:10px 4px; margin-right:18px; font-size:15px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .tab:disabled{ color:var(--line); cursor:not-allowed; }

  /* ---- Timeline / day cards ---- */
  .timeline{ position:relative; padding-left:32px; }
  .timeline::before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:1px; background:var(--line); }
  .day{ position:relative; padding-bottom:14px; }
  .day:last-child{ padding-bottom:0; }
  .day::before{ content:""; position:absolute; left:-32px; top:4px; width:11px; height:11px; border-radius:50%; background:var(--surface); border:2px solid var(--line); }
  .day.confirmed::before{ border-color:var(--confirmed); background:var(--confirmed); }
  .day.open::before{ border-color:var(--gold); background:var(--surface); }

  .day-summary{ width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; cursor:pointer; transition:border-color .15s ease; display:block; }
  .day-summary:hover{ border-color:var(--accent); }
  .day-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .day-title{ display:flex; align-items:baseline; gap:10px; }
  .day-date{ font-weight:700; font-size:16px; }
  .day-summary-body{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .day-summary-text{ font-size:14.5px; }
  .day-summary-text.muted{ color:var(--ink-soft); font-style:italic; }
  .day-arrow{ flex:0 0 auto; font-size:13px; color:var(--accent); font-weight:700; white-space:nowrap; }

  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:700; color:var(--ink-soft); background:none; border:none; padding:0; cursor:pointer; margin-bottom:24px; }
  .back-link:hover{ color:var(--accent); }

  .detail-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px; flex-wrap:wrap; }
  .detail-head h2{ font-family:"Noto Serif KR",serif; font-size:24px; font-weight:700; margin:0; }
  .detail-sub{ color:var(--ink-soft); font-size:14px; margin-bottom:22px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; }
  .plan-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .plan-list li{ display:flex; gap:12px; align-items:flex-start; font-size:14.5px; }
  .plan-time{ flex:0 0 auto; color:var(--accent); font-weight:700; font-size:13px; padding-top:2px; min-width:56px; }
  .plan-text{ flex:1 1 auto; }
  .plan-actions{ flex:0 0 auto; display:flex; gap:2px; }

  /* ---- Budget ---- */
  .budget-hero{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:18px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px 24px; margin-bottom:16px; }
  .budget-label{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .budget-amount{ font-family:"JetBrains Mono",monospace; font-size:32px; font-weight:500; letter-spacing:-.02em; }
  .budget-amount span{ font-size:16px; color:var(--ink-soft); margin-left:4px; }
  .budget-per{ text-align:right; color:var(--ink-soft); font-size:13px; }
  .budget-per b{ display:block; font-family:"JetBrains Mono",monospace; color:var(--ink); font-size:18px; font-weight:500; }
  .budget-bar{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:14px; }
  .budget-bar-fill{ height:100%; background:var(--accent); }
  .cat-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .cat-row:last-child{ border-bottom:none; }
  .cat-name{ font-weight:700; }
  .cat-amt{ font-family:"JetBrains Mono",monospace; }
  .item-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; font-size:13.5px; color:var(--ink-soft); }

  /* ---- Checklist ---- */
  .checklist{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
  @media (max-width:560px){ .checklist{ grid-template-columns:1fr; } }
  .check-item{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:14px; }
  .check-item button.box-btn{ all:unset; cursor:pointer; flex:0 0 auto; }
  .box{ width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .check-item.done .box{ border-color:var(--confirmed); background:var(--confirmed); }
  .check-item.done .check-text{ color:var(--ink-soft); text-decoration:line-through; }
  .check-text{ flex:1 1 auto; }

  /* ---- Review ---- */
  .review-locked{ display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--ink-soft); background:var(--surface-2); border-radius:12px; padding:18px 20px; }
  .review-text{ white-space:pre-wrap; font-size:15px; }
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:18px; }
  .photo-thumb{ position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--line); aspect-ratio:1; background:var(--surface-2); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-del{ position:absolute; top:6px; right:6px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:6px; width:24px; height:24px; cursor:pointer; font-size:13px; }
  .photo-uploading{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-soft); }

  /* ---- Food recommendation ---- */
  .food-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:22px; }
  .food-form .field{ flex:1 1 160px; margin-bottom:0; }
  .food-results{ display:flex; flex-direction:column; gap:12px; }
  .food-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .food-card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .food-card-name{ font-family:"Noto Serif KR",serif; font-weight:700; font-size:16.5px; }
  .food-card-tag{ font-size:12px; color:var(--ink-soft); background:var(--surface-2); padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .food-card-why{ font-size:14px; color:var(--ink-soft); }
  .food-loading{ text-align:center; color:var(--ink-soft); font-size:14px; padding:24px; }

  /* ---- Modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,16,12,.45); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; }
  .modal{ background:var(--surface); border-radius:16px; border:1px solid var(--line); padding:26px 26px 22px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; }
  .modal h3{ font-family:"Noto Serif KR",serif; font-size:19px; margin:0 0 18px; }
  .field{ margin-bottom:14px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

  .note{ display:flex; gap:10px; align-items:flex-start; font-size:13px; color:var(--ink-soft); background:var(--surface-2); border-radius:10px; padding:11px 14px; margin-top:14px; }
  .note .dot{ flex:0 0 auto; width:6px; height:6px; margin-top:7px; border-radius:50%; background:var(--gold); }

  footer.app-footer{ text-align:center; color:var(--ink-soft); font-size:12.5px; padding-top:12px; border-top:1px solid var(--line); margin-top:20px; }
</style>

<div class="page" id="app"></div>

<script>
(function(){
  "use strict";

  window.__toggleItemKind = function(v){
    var t = document.getElementById("item-time-field");
    var l = document.getElementById("item-label-field");
    if(t) t.style.display = (v === "time") ? "block" : "none";
    if(l) l.style.display = (v === "label") ? "block" : "none";
  };

  var db = null, assetsNs = null, sampleNs = null, dbReady = false, dbState = "loading";
  var debugInfo = { snapshots:0, lastSize:null, lastFromCache:null, lastAt:null, manualSize:null, manualError:null, mapError:null };
  var trips = [];
  var ui = { screen:'home', tripId:null, tab:'itinerary', dayIdx:null, modal:null };
  var uploadingPhoto = false;
  var photoUploadError = null;
  var food = { region:'', preference:'', loading:false, error:null, results:null };

  var DEFAULT_CHECKLIST = [
    "여권 & 항공권 e-티켓","엔화 환전 / 트래블카드","eSIM 또는 포켓와이파이",
    "숙소 예약 확인서","보조배터리 & 충전기","상비약","여행자 보험","캐리어 무게 확인"
  ].map(function(t){ return { text:t, done:false }; });

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function uid(){ return Math.random().toString(36).slice(2) + Date.now().toString(36); }
  function todayStr(){ var d = new Date(); return d.toISOString().slice(0,10); }
  function fmtDate(iso){
    if(!iso) return "";
    var d = new Date(iso + "T00:00:00");
    var days = ["일","월","화","수","목","금","토"];
    return (d.getMonth()+1) + "." + d.getDate() + " (" + days[d.getDay()] + ")";
  }
  function fmtMoney(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
  function tripStatus(t){
    var today = todayStr();
    if(t.endDate && today > t.endDate) return "completed";
    if(t.startDate && today >= t.startDate) return "ongoing";
    return "upcoming";
  }
  function statusLabel(s){
    return { upcoming:"예정", ongoing:"여행중", completed:"완료" }[s] || s;
  }
  function mapUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
  function itemKind(it){
    if(it.kind === "time" || it.kind === "label") return it.kind;
    return /^\d{1,2}:\d{2}$/.test(it.time||"") ? "time" : "label";
  }
  function ddayLabel(t){
    var st = tripStatus(t);
    if(st === "completed" || !t.startDate || !t.endDate) return null;
    var today = new Date(todayStr() + "T00:00:00");
    var start = new Date(t.startDate + "T00:00:00");
    if(st === "ongoing"){
      var end = new Date(t.endDate + "T00:00:00");
      var totalDays = Math.round((end-start)/86400000) + 1;
      var dayNum = Math.round((today-start)/86400000) + 1;
      return dayNum + "일차 / " + totalDays + "일";
    }
    var diff = Math.round((start-today)/86400000);
    return diff === 0 ? "D-DAY" : ("D-" + diff);
  }
  function getTrip(id){
    for(var i=0;i<trips.length;i++) if(trips[i].id === id) return trips[i];
    return null;
  }
  function cloneTrip(t){ return JSON.parse(JSON.stringify(t)); }

  function saveTrip(trip){
    var data = cloneTrip(trip);
    var id = data.id; delete data.id;
    return db.doc("trips/" + id).set(data);
  }

  /* ---------------- render ---------------- */

  function render(){
    var app = document.getElementById("app");
    var html = "";
    html += renderHeader();
    if(ui.screen === "home"){
      html += renderHome();
    } else {
      var trip = getTrip(ui.tripId);
      if(!trip){ ui.screen = "home"; html += renderHome(); }
      else html += renderTrip(trip);
    }
    html += '<footer class="app-footer">여행 플래너 · ' + trips.length + '개 여행 관리 중</footer>';
    app.innerHTML = html;
    renderModal();
  }

  function renderHeader(){
    return (
      '<header class="top">' +
        '<span class="eyebrow">Travel Planner</span>' +
        '<div class="top-row">' +
          '<div>' +
            '<h1>여행 플래너</h1>' +
            '<div class="subline">여러 여행을 관리하고, 다녀온 여행엔 후기와 사진을 남겨보세요.</div>' +
          '</div>' +
        '</div>' +
      '</header>'
    );
  }

  function renderHome(){
    if(!dbReady){
      var msg = dbState === "loading" ? "저장 기능을 불러오는 중이에요…"
        : dbState === "unavailable" ? "이 화면에서는 저장 기능을 사용할 수 없어요. (window.claude.use(\"db\")가 null을 반환했어요)"
        : "실시간 연결이 끊겼어요. 새로고침해보세요. (오류: " + esc(dbState) + ")";
      return '<div class="empty">' + msg + '</div>';
    }
    var html = '<section><div class="section-head"><h2>내 여행</h2>' +
      '<button class="btn btn-primary" data-action="add-trip">+ 새 여행</button></div>';

    html += '<div class="note" style="margin-bottom:18px;"><span class="dot"></span>' +
      '<span>동행자와 함께 계획하려면 화면 위 공유 버튼으로 편집 권한을 초대하세요. 초대된 사람은 같은 여행 목록을 실시간으로 보고 수정할 수 있어요.</span></div>';

    if(trips.length === 0){
      html += '<div class="empty">아직 등록된 여행이 없어요. "새 여행"으로 첫 여행을 만들어보세요.</div>';
      html += '<div class="note" style="margin-top:14px;"><span class="dot"></span><span>' +
        '진단 정보 — 실시간 구독 수신 ' + debugInfo.snapshots + '회, 마지막 문서 수: ' + debugInfo.lastSize +
        ', 캐시여부: ' + debugInfo.lastFromCache + ', 수신 시각: ' + esc(debugInfo.lastAt) +
        (debugInfo.manualSize != null ? (' · 단발성 조회 결과: ' + debugInfo.manualSize + '건') : '') +
        (debugInfo.manualError ? (' · 단발성 조회 오류: ' + esc(debugInfo.manualError)) : '') +
        (debugInfo.mapError ? (' · 변환 오류: ' + esc(debugInfo.mapError)) : '') +
        '</span></div>';
      html += '<button class="btn btn-sm" style="margin-top:10px;" data-action="debug-refetch">단발성으로 다시 조회</button>';
    } else {
      var sorted = trips.slice().sort(function(a,b){ return (a.startDate||"").localeCompare(b.startDate||""); });
      html += '<div class="trip-grid">';
      sorted.forEach(function(t){
        var st = tripStatus(t);
        var dday = ddayLabel(t);
        html += '<button class="trip-card" data-action="open-trip" data-id="' + t.id + '">' +
          '<div class="trip-card-top">' +
            '<span class="trip-card-title">' + esc(t.title) + '</span>' +
            '<span class="btn-row" style="align-items:center;">' +
              (dday ? '<span class="food-card-tag nums">' + esc(dday) + '</span>' : '') +
              '<span class="status ' + st + '">' + statusLabel(st) + '</span>' +
            '</span>' +
          '</div>' +
          '<div class="trip-card-meta">' +
            '<span>📍 ' + esc(t.destination || "-") + '</span>' +
            '<span class="nums">📅 ' + esc(t.startDate) + ' ~ ' + esc(t.endDate) + '</span>' +
            (t.travelers ? '<span class="nums">👥 ' + esc(t.travelers) + '명</span>' : '') +
            (t.budgetTotal ? '<span class="nums">💴 ' + fmtMoney(t.budgetTotal) + '원</span>' : '') +
          '</div>' +
        '</button>';
      });
      html += '</div>';
    }
    html += '</section>';
    return html;
  }

  function renderTrip(trip){
    var st = tripStatus(trip);
    var dday = ddayLabel(trip);
    var html = '<button class="back-link" data-action="go-home">← 여행 목록으로</button>';
    html += '<div class="trip-head">' +
      '<div class="trip-head-top">' +
        '<h1>' + esc(trip.title) + '</h1>' +
        '<div class="btn-row">' +
          '<button class="btn btn-sm" data-action="edit-trip">여행 정보 수정</button>' +
          '<button class="btn btn-sm btn-danger" data-action="delete-trip" data-id="' + trip.id + '">삭제</button>' +
        '</div>' +
      '</div>' +
      '<div class="chips">' +
        '<span class="chip">' + '<span class="status ' + st + '">' + statusLabel(st) + '</span></span>' +
        (dday ? '<span class="chip"><b>' + esc(dday) + '</b></span>' : '') +
        (trip.destination ? '<a class="chip" href="' + mapUrl(trip.destination) + '" target="_blank" rel="noopener">📍 ' + esc(trip.destination) + ' · 지도</a>' : '<span class="chip">📍 -</span>') +
        '<span class="chip nums">📅 ' + esc(trip.startDate) + ' – ' + esc(trip.endDate) + '</span>' +
        (trip.travelers ? '<span class="chip">👥 <b>' + esc(trip.travelers) + '명</b></span>' : '') +
        (trip.budgetTotal ? '<span class="chip">💴 예산 <b>' + fmtMoney(trip.budgetTotal) + '원</b></span>' : '') +
      '</div>' +
    '</div>';

    var canReview = st === "completed";
    html += '<div class="tabbar">' +
      tabBtn("itinerary","일정") + tabBtn("budget","예산") + tabBtn("checklist","체크리스트") + tabBtn("food","맛집 추천") +
      '<button class="tab' + (ui.tab==="review"?" active":"") + '" ' + (canReview?'':'disabled') +
        ' data-action="set-tab" data-tab="review">후기' + (canReview?'':' 🔒') + '</button>' +
    '</div>';

    if(ui.tab === "itinerary") html += renderItinerary(trip);
    else if(ui.tab === "budget") html += renderBudget(trip);
    else if(ui.tab === "checklist") html += renderChecklist(trip);
    else if(ui.tab === "food") html += renderFood(trip);
    else if(ui.tab === "review") html += renderReview(trip, canReview);

    return html;
  }

  function tabBtn(key, label){
    return '<button class="tab' + (ui.tab===key?" active":"") + '" data-action="set-tab" data-tab="' + key + '">' + label + '</button>';
  }

  function renderItinerary(trip){
    var days = trip.days || [];
    if(ui.dayIdx !== null && ui.dayIdx < days.length){
      return renderDayDetail(trip, ui.dayIdx);
    }
    var html = '<section><div class="section-head"><h2>일자별 일정</h2>' +
      '<button class="btn btn-primary btn-sm" data-action="add-day" data-id="' + trip.id + '">+ 날짜 추가</button></div>';

    if(days.length === 0){
      html += '<div class="empty">아직 일정이 없어요. "날짜 추가"로 첫 날짜를 만들어보세요.</div></section>';
      return html;
    }

    html += '<div class="timeline">';
    days.forEach(function(d, idx){
      var cls = d.status === "confirmed" ? "confirmed" : "open";
      var summary = d.summary ? esc(d.summary) : "";
      html += '<div class="day ' + cls + '">' +
        '<button class="day-summary" data-action="open-day" data-idx="' + idx + '">' +
          '<div class="day-top">' +
            '<div class="day-title"><span class="day-date nums">' + fmtDate(d.date) + '</span></div>' +
            '<span class="status ' + cls + '">' + (cls==="confirmed"?"확정":"자유일정") + '</span>' +
          '</div>' +
          '<div class="day-summary-body">' +
            '<span class="day-summary-text' + (summary?"":" muted") + '">' + (summary || "세부 계획 미정") + '</span>' +
            '<span class="day-arrow">자세히 →</span>' +
          '</div>' +
        '</button>' +
      '</div>';
    });
    html += '</div></section>';
    return html;
  }

  function renderDayDetail(trip, idx){
    var d = trip.days[idx];
    var cls = d.status === "confirmed" ? "confirmed" : "open";
    var html = '<button class="back-link" data-action="back-to-days">← 일정 목록으로</button>';
    html += '<div class="detail-head"><h2>' + fmtDate(d.date) + '</h2>' +
      '<div class="btn-row">' +
        '<span class="status ' + cls + '">' + (cls==="confirmed"?"확정":"자유일정") + '</span>' +
        '<button class="btn btn-sm" data-action="edit-day" data-idx="' + idx + '">날짜 수정</button>' +
        '<button class="btn btn-sm btn-danger" data-action="delete-day" data-idx="' + idx + '">삭제</button>' +
      '</div></div>';
    html += '<div class="detail-sub">' + (d.summary ? esc(d.summary) : "세부 계획 미정") + '</div>';

    var items = d.items || [];
    var timeEntries = [], labelEntries = [];
    items.forEach(function(it, i){
      (itemKind(it) === "time" ? timeEntries : labelEntries).push({ it:it, idx:i });
    });
    timeEntries.sort(function(a,b){ return (a.it.time||"").localeCompare(b.it.time||""); });

    function itemLi(entry){
      var it = entry.it, iidx = entry.idx;
      return '<li>' +
        (it.time ? '<span class="plan-time">' + esc(it.time) + '</span>' : '<span class="plan-time"></span>') +
        '<span class="plan-text">' + esc(it.text) +
          ' <a href="' + mapUrl(it.text + " " + (trip.destination||"")) + '" target="_blank" rel="noopener" style="font-size:12px;white-space:nowrap;">🗺️ 지도</a>' +
        '</span>' +
        '<span class="plan-actions">' +
          '<button class="btn-ghost btn-sm" data-action="edit-item" data-idx="' + iidx + '">수정</button>' +
          '<button class="btn-ghost btn-sm btn-danger" data-action="delete-item" data-idx="' + iidx + '">삭제</button>' +
        '</span>' +
      '</li>';
    }

    if(items.length === 0){
      html += '<div class="card" style="color:var(--ink-soft);font-style:italic;">아직 등록된 세부 항목이 없어요.</div>';
    } else {
      html += '<div class="card"><div class="section-note" style="margin-bottom:10px;">타임라인</div><ul class="plan-list">';
      html += timeEntries.length
        ? timeEntries.map(itemLi).join("")
        : '<li style="color:var(--ink-soft);font-style:italic;">시간이 정해진 항목이 없어요.</li>';
      html += '</ul></div>';

      if(labelEntries.length){
        html += '<div class="card" style="margin-top:12px;"><div class="section-note" style="margin-bottom:10px;">시간 미정 / 기타</div><ul class="plan-list">' +
          labelEntries.map(itemLi).join("") +
        '</ul></div>';
      }
    }
    html += '<div class="btn-row" style="margin-top:16px;">' +
      '<button class="btn btn-sm" data-action="add-item">+ 항목 추가</button>' +
    '</div>';
    return html;
  }

  function renderBudget(trip){
    var items = trip.budgetItems || [];
    var spent = items.reduce(function(s,it){ return s + (Number(it.amount)||0); }, 0);
    var total = Number(trip.budgetTotal) || 0;
    var pct = total > 0 ? Math.min(100, Math.round(spent/total*100)) : 0;

    var byCat = {};
    items.forEach(function(it){
      var c = it.category || "기타";
      byCat[c] = (byCat[c]||0) + (Number(it.amount)||0);
    });

    var html = '<section>' +
      '<div class="budget-hero">' +
        '<div><div class="budget-label">지출 합계</div>' +
          '<div class="budget-amount nums">' + fmtMoney(spent) + '<span>원</span></div>' +
        '</div>' +
        '<div class="budget-per">총 예산<b class="nums">' + fmtMoney(total) + '원</b></div>' +
      '</div>' +
      '<div class="budget-bar"><div class="budget-bar-fill" style="width:' + pct + '%;"></div></div>' +
    '</section>';

    html += '<section><div class="section-head"><h2>카테고리별 집계</h2></div>';
    var cats = Object.keys(byCat);
    if(cats.length === 0){
      html += '<div class="empty">등록된 지출 항목이 없어요.</div>';
    } else {
      html += '<div class="card">';
      cats.sort(function(a,b){ return byCat[b]-byCat[a]; }).forEach(function(c){
        html += '<div class="cat-row"><span class="cat-name">' + esc(c) + '</span><span class="cat-amt nums">' + fmtMoney(byCat[c]) + '원</span></div>';
      });
      html += '</div>';
    }
    html += '</section>';

    html += '<section><div class="section-head"><h2>지출 내역</h2>' +
      '<button class="btn btn-primary btn-sm" data-action="add-budget">+ 항목 추가</button></div>';
    if(items.length === 0){
      html += '<div class="empty">아직 등록된 지출이 없어요.</div>';
    } else {
      html += '<div class="card">';
      items.forEach(function(it, idx){
        html += '<div class="item-row">' +
          '<span>' + esc(it.category||"기타") + (it.memo ? ' · ' + esc(it.memo) : '') + '</span>' +
          '<span class="btn-row" style="align-items:center;">' +
            '<span class="nums" style="color:var(--ink);font-family:\'JetBrains Mono\',monospace;">' + fmtMoney(it.amount) + '원</span>' +
            '<button class="btn-ghost btn-sm btn-danger" data-action="delete-budget" data-idx="' + idx + '">삭제</button>' +
          '</span>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</section>';

    html += '<section><div class="section-head"><h2>환율 계산기</h2><span class="section-note">참고용 · 수동 입력 환율</span></div>' +
      '<div class="card"><div class="field-row">' +
        '<div class="field"><label>엔화 금액 (¥)</label><input type="number" id="fx-jpy" placeholder="예: 10000"></div>' +
        '<div class="field"><label>환율 (100엔당 원)</label><input type="number" id="fx-rate" value="900"></div>' +
      '</div><div style="margin-top:4px;font-size:15px;">≈ <b id="fx-result" class="nums">0</b>원</div></div></section>';

    return html;
  }

  function renderChecklist(trip){
    var items = trip.checklist || [];
    var html = '<section><div class="section-head"><h2>준비물 체크리스트</h2>' +
      '<button class="btn btn-primary btn-sm" data-action="add-check">+ 항목 추가</button></div>';
    if(items.length === 0){
      html += '<div class="empty">아직 등록된 준비물이 없어요.</div></section>';
      return html;
    }
    html += '<div class="checklist">';
    items.forEach(function(it, idx){
      html += '<div class="check-item' + (it.done?" done":"") + '">' +
        '<button class="box-btn" data-action="toggle-check" data-idx="' + idx + '"><span class="box">' + (it.done?"✓":"") + '</span></button>' +
        '<span class="check-text">' + esc(it.text) + '</span>' +
        '<button class="btn-ghost btn-sm btn-danger" data-action="delete-check" data-idx="' + idx + '">삭제</button>' +
      '</div>';
    });
    html += '</div></section>';
    return html;
  }

  function renderFood(trip){
    var html = '<section><div class="section-head"><h2>AI 맛집 추천</h2>' +
      '<span class="section-note">Claude의 지식 기반 추천 · 참고용, 방문 전 확인 필요</span></div>';

    if(!sampleNs){
      html += '<div class="empty">이 화면에서는 AI 추천 기능을 사용할 수 없어요.</div></section>';
      return html;
    }

    if(!food.region) food.region = trip.destination || "";

    html += '<form class="food-form" data-form="food-reco">' +
      '<div class="field"><label>지역</label><input name="region" type="text" placeholder="예: 아키하바라, 모토하코네" value="' + esc(food.region) + '" required></div>' +
      '<div class="field"><label>선호(선택)</label><input name="preference" type="text" placeholder="예: 라멘, 가성비, 현지인 맛집" value="' + esc(food.preference) + '"></div>' +
      '<button type="submit" class="btn btn-primary" ' + (food.loading?'disabled':'') + '>' + (food.loading?"찾는 중…":"추천받기") + '</button>' +
    '</form>';

    if(food.error){
      html += '<div class="note"><span class="dot"></span><span>' + esc(food.error) + '</span></div>';
    }

    if(food.loading){
      html += '<div class="food-loading">근처 맛집을 찾고 있어요…</div>';
    } else if(food.results && food.results.length){
      html += '<div class="food-results">';
      food.results.forEach(function(r){
        html += '<div class="food-card">' +
          '<div class="food-card-top"><span class="food-card-name">' + esc(r.name) + '</span>' +
          (r.category ? '<span class="food-card-tag">' + esc(r.category) + '</span>' : '') + '</div>' +
          (r.why ? '<div class="food-card-why">' + esc(r.why) + '</div>' : '') +
        '</div>';
      });
      html += '</div>';
    } else if(food.results){
      html += '<div class="empty">추천 결과가 없어요. 다른 지역으로 시도해보세요.</div>';
    }

    html += '<div class="note"><span class="dot"></span><span>AI가 알고 있는 정보를 바탕으로 한 참고용 추천이에요. 실제 영업 여부·주소·평점은 방문 전 꼭 다시 확인하세요.</span></div>';
    html += '</section>';
    return html;
  }

  function renderReview(trip, canReview){
    if(!canReview){
      return '<section><div class="review-locked"><span>🔒</span>' +
        '<span>여행 종료일(' + esc(trip.endDate) + ') 이후에 후기와 사진을 등록할 수 있어요.</span></div></section>';
    }
    var review = trip.review || { text:"", photoIds:[] };
    var html = '<section><div class="section-head"><h2>여행 후기</h2>' +
      '<button class="btn btn-sm" data-action="edit-review">' + (review.text ? "후기 수정" : "후기 작성") + '</button></div>';

    html += '<div class="card">';
    html += review.text
      ? '<div class="review-text">' + esc(review.text) + '</div>'
      : '<div style="color:var(--ink-soft);font-style:italic;">아직 후기가 없어요.</div>';
    html += '</div></section>';

    html += '<section><div class="section-head"><h2>사진</h2>' +
      (assetsNs ? '<label class="btn btn-sm" style="cursor:pointer;">' +
        (uploadingPhoto ? "업로드 중…" : "+ 사진 추가") +
        '<input type="file" accept="image/*" style="display:none;" id="photo-input" ' + (uploadingPhoto?'disabled':'') + '></label>'
        : '') +
    '</div>';

    var photoIds = review.photoIds || [];
    if(photoIds.length === 0){
      html += '<div class="empty">등록된 사진이 없어요.</div>';
    } else {
      html += '<div class="photo-grid">';
      photoIds.forEach(function(id){
        html += '<div class="photo-thumb"><img src="/_blob/' + id + '" alt="여행 사진" loading="lazy">' +
          (assetsNs ? '<button class="photo-del" data-action="delete-photo" data-id="' + id + '">✕</button>' : '') +
        '</div>';
      });
      html += '</div>';
    }
    if(!assetsNs){
      html += '<div class="note"><span class="dot"></span><span>이 화면에서는 사진 업로드를 사용할 수 없어요.</span></div>';
    }
    if(photoUploadError){
      html += '<div class="note"><span class="dot"></span><span>' + esc(photoUploadError) + '</span></div>';
    }
    html += '</section>';
    return html;
  }

  /* ---------------- modal ---------------- */

  function renderModal(){
    var root = document.getElementById("modal-root");
    if(!root){
      root = document.createElement("div");
      root.id = "modal-root";
      document.body.appendChild(root);
    }
    if(!ui.modal){ root.innerHTML = ""; return; }
    root.innerHTML = '<div class="modal-overlay">' +
      '<div class="modal" id="modal-box"></div></div>';
    var box = document.getElementById("modal-box");
    box.innerHTML = buildModalContent(ui.modal);
  }

  function buildModalContent(m){
    if(m.type === "confirm"){
      return '<h3>확인</h3><p style="margin:0 0 4px;">' + esc(m.message) + '</p>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn" data-action="close-modal">취소</button>' +
          '<button type="button" class="btn btn-primary" style="background:var(--danger);border-color:var(--danger);" data-action="confirm-yes">삭제</button>' +
        '</div>';
    }
    if(m.type === "add-trip"){
      return '<h3>새 여행 만들기</h3><form data-form="add-trip">' +
        field("title","여행 이름","text","예: 오사카 벚꽃 여행", true) +
        field("destination","목적지","text","예: 오사카", false) +
        '<div class="field-row">' + field("startDate","시작일","date","",true) + field("endDate","종료일","date","",true) + '</div>' +
        '<div class="field-row">' + field("travelers","인원 수","number","예: 2", false, 1) + field("budgetTotal","총 예산 (원)","number","예: 1000000", false) + '</div>' +
        modalActions("여행 만들기") + '</form>';
    }
    if(m.type === "edit-trip"){
      var t = getTrip(ui.tripId);
      return '<h3>여행 정보 수정</h3><form data-form="edit-trip">' +
        field("title","여행 이름","text","",true,t.title) +
        field("destination","목적지","text","",false,t.destination) +
        '<div class="field-row">' + field("startDate","시작일","date","",true,t.startDate) + field("endDate","종료일","date","",true,t.endDate) + '</div>' +
        '<div class="field-row">' + field("travelers","인원 수","number","",false,t.travelers||1) + field("budgetTotal","총 예산 (원)","number","",false,t.budgetTotal) + '</div>' +
        modalActions("저장") + '</form>';
    }
    if(m.type === "add-day" || m.type === "edit-day"){
      var isEdit = m.type === "edit-day";
      var trip = getTrip(ui.tripId);
      var d = isEdit ? trip.days[m.idx] : { date:"", status:"open", summary:"" };
      return '<h3>' + (isEdit?"날짜 수정":"날짜 추가") + '</h3><form data-form="' + m.type + '">' +
        field("date","날짜","date","",true,d.date) +
        '<div class="field"><label>상태</label><select name="status">' +
          '<option value="open"' + (d.status==="open"?" selected":"") + '>자유일정</option>' +
          '<option value="confirmed"' + (d.status==="confirmed"?" selected":"") + '>확정</option>' +
        '</select></div>' +
        field("summary","한 줄 요약","text","예: 아키하바라 관광 & 쇼핑",false,d.summary) +
        modalActions(isEdit?"저장":"추가") + '</form>';
    }
    if(m.type === "add-item" || m.type === "edit-item"){
      var isEditI = m.type === "edit-item";
      var trip2 = getTrip(ui.tripId);
      var it = isEditI ? trip2.days[ui.dayIdx].items[m.idx] : { time:"", text:"" };
      var kind = isEditI ? itemKind(it) : "time";
      return '<h3>' + (isEditI?"항목 수정":"항목 추가") + '</h3><form data-form="' + m.type + '">' +
        '<div class="field"><label>기준</label><div class="btn-row" style="gap:16px;">' +
          '<label style="display:flex;align-items:center;gap:6px;font-weight:400;color:var(--ink);">' +
            '<input type="radio" name="kind" value="time"' + (kind==="time"?" checked":"") + ' onchange="window.__toggleItemKind(this.value)"> 시간</label>' +
          '<label style="display:flex;align-items:center;gap:6px;font-weight:400;color:var(--ink);">' +
            '<input type="radio" name="kind" value="label"' + (kind==="label"?" checked":"") + ' onchange="window.__toggleItemKind(this.value)"> 글자</label>' +
        '</div></div>' +
        '<div class="field" id="item-time-field" style="display:' + (kind==="time"?"block":"none") + ';">' +
          '<label>시간</label><input type="time" name="timeValue" value="' + esc(kind==="time"?(it.time||""):"") + '"></div>' +
        '<div class="field" id="item-label-field" style="display:' + (kind==="label"?"block":"none") + ';">' +
          '<label>구분 글자</label><input type="text" name="labelValue" placeholder="예: 이동, 식사, 귀국" value="' + esc(kind==="label"?(it.time||""):"") + '"></div>' +
        field("text","내용","text","예: 오와쿠다니 로프웨이",true,it.text) +
        modalActions(isEditI?"저장":"추가") + '</form>';
    }
    if(m.type === "add-budget"){
      return '<h3>지출 항목 추가</h3><form data-form="add-budget">' +
        field("category","카테고리","text","예: 숙박 / 교통 / 식비 / 쇼핑",true) +
        field("amount","금액 (원)","number","예: 150000",true) +
        field("memo","메모","text","선택",false) +
        modalActions("추가") + '</form>';
    }
    if(m.type === "add-check"){
      return '<h3>준비물 추가</h3><form data-form="add-check">' +
        field("text","항목","text","예: 온천용 수건",true) +
        modalActions("추가") + '</form>';
    }
    if(m.type === "edit-review"){
      var trip3 = getTrip(ui.tripId);
      var rv = trip3.review || {text:""};
      return '<h3>여행 후기</h3><form data-form="edit-review">' +
        '<div class="field"><label>후기</label><textarea name="text" rows="7" placeholder="여행은 어땠나요?">' + esc(rv.text) + '</textarea></div>' +
        modalActions("저장") + '</form>';
    }
    return "";
  }

  function field(name, labelText, type, placeholder, required, value){
    return '<div class="field"><label>' + esc(labelText) + '</label>' +
      '<input name="' + name + '" type="' + type + '" placeholder="' + esc(placeholder||"") + '"' +
      (required?" required":"") + (value!=null?' value="' + esc(value) + '"':"") + '></div>';
  }
  function modalActions(submitLabel){
    return '<div class="modal-actions">' +
      '<button type="button" class="btn" data-action="close-modal">취소</button>' +
      '<button type="submit" class="btn btn-primary">' + submitLabel + '</button>' +
    '</div>';
  }

  /* ---------------- actions ---------------- */

  function openModal(type, extra){
    ui.modal = Object.assign({ type:type }, extra || {});
    render();
  }
  function closeModal(){ ui.modal = null; render(); }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    var idx = el.getAttribute("data-idx");
    var id = el.getAttribute("data-id");

    if(action === "close-modal"){ closeModal(); return; }
    if(action === "go-home"){ ui.screen="home"; ui.tripId=null; ui.dayIdx=null; ui.tab="itinerary"; render(); return; }
    if(action === "open-trip"){
      ui.screen="trip"; ui.tripId=id; ui.tab="itinerary"; ui.dayIdx=null;
      food = { region:'', preference:'', loading:false, error:null, results:null };
      render(); return;
    }
    if(action === "set-tab"){ ui.tab = el.getAttribute("data-tab"); ui.dayIdx=null; render(); return; }
    if(action === "debug-refetch"){
      if(!db){ debugInfo.manualError = "db is null"; render(); return; }
      db.collection("trips").get().then(function(snap){
        debugInfo.manualSize = snap.size; debugInfo.manualError = null; render();
      }).catch(function(err){
        debugInfo.manualError = (err && err.code) || "unknown"; render();
      });
      return;
    }
    if(action === "add-trip"){ openModal("add-trip"); return; }
    if(action === "edit-trip"){ openModal("edit-trip"); return; }
    if(action === "delete-trip"){
      openModal("confirm", { message:"이 여행을 삭제할까요? 되돌릴 수 없어요.", onYes:"delete-trip", targetId:id });
      return;
    }
    if(action === "add-day"){ openModal("add-day"); return; }
    if(action === "edit-day"){ openModal("edit-day", { idx:Number(idx) }); return; }
    if(action === "delete-day"){
      openModal("confirm", { message:"이 날짜를 삭제할까요?", onYes:"delete-day", idx:Number(idx) });
      return;
    }
    if(action === "open-day"){ ui.dayIdx = Number(idx); render(); return; }
    if(action === "back-to-days"){ ui.dayIdx = null; render(); return; }
    if(action === "add-item"){ openModal("add-item"); return; }
    if(action === "edit-item"){ openModal("edit-item", { idx:Number(idx) }); return; }
    if(action === "delete-item"){
      openModal("confirm", { message:"이 항목을 삭제할까요?", onYes:"delete-item", idx:Number(idx) });
      return;
    }
    if(action === "confirm-yes"){
      var m = ui.modal || {};
      if(m.onYes === "delete-trip"){
        db.doc("trips/"+m.targetId).delete();
        ui.screen="home"; ui.tripId=null;
      } else if(m.onYes === "delete-day"){
        var tripD = getTrip(ui.tripId);
        tripD.days.splice(m.idx,1);
        saveTrip(tripD);
        ui.dayIdx = null;
      } else if(m.onYes === "delete-item"){
        var tripI = getTrip(ui.tripId);
        tripI.days[ui.dayIdx].items.splice(m.idx,1);
        saveTrip(tripI);
      }
      closeModal();
      return;
    }
    if(action === "add-budget"){ openModal("add-budget"); return; }
    if(action === "delete-budget"){
      var trip5 = getTrip(ui.tripId);
      trip5.budgetItems.splice(Number(idx),1);
      saveTrip(trip5); render();
      return;
    }
    if(action === "add-check"){ openModal("add-check"); return; }
    if(action === "toggle-check"){
      var trip6 = getTrip(ui.tripId);
      trip6.checklist[Number(idx)].done = !trip6.checklist[Number(idx)].done;
      saveTrip(trip6); render();
      return;
    }
    if(action === "delete-check"){
      var trip7 = getTrip(ui.tripId);
      trip7.checklist.splice(Number(idx),1);
      saveTrip(trip7); render();
      return;
    }
    if(action === "edit-review"){ openModal("edit-review"); return; }
    if(action === "delete-photo"){
      var trip8 = getTrip(ui.tripId);
      trip8.review.photoIds = (trip8.review.photoIds||[]).filter(function(pid){ return pid !== id; });
      saveTrip(trip8).then(function(){
        if(assetsNs) assetsNs.delete(id).catch(function(){});
      });
      render();
      return;
    }
  });

  document.addEventListener("input", function(e){
    if(e.target && (e.target.id === "fx-jpy" || e.target.id === "fx-rate")){
      var jpyEl = document.getElementById("fx-jpy");
      var rateEl = document.getElementById("fx-rate");
      var resultEl = document.getElementById("fx-result");
      if(!jpyEl || !rateEl || !resultEl) return;
      var jpy = Number(jpyEl.value) || 0;
      var rate = Number(rateEl.value) || 0;
      var krw = Math.round(jpy * (rate / 100));
      resultEl.textContent = fmtMoney(krw);
    }
  });

  document.addEventListener("change", function(e){
    if(e.target && e.target.id === "photo-input" && e.target.files && e.target.files[0]){
      var file = e.target.files[0];
      var trip = getTrip(ui.tripId);
      if(!assetsNs || !trip) return;
      uploadingPhoto = true; photoUploadError = null; render();
      assetsNs.upload(file).then(function(res){
        trip.review = trip.review || { text:"", photoIds:[] };
        trip.review.photoIds = (trip.review.photoIds||[]).concat([res.id]);
        return saveTrip(trip);
      }).catch(function(err){
        photoUploadError = "사진 업로드에 실패했어요: " + (err && err.message ? err.message : "알 수 없는 오류");
      }).then(function(){
        uploadingPhoto = false; render();
      });
    }
  });

  document.addEventListener("submit", function(e){
    var form = e.target.closest("form[data-form]");
    if(!form) return;
    e.preventDefault();
    var type = form.getAttribute("data-form");
    var fd = new FormData(form);
    var val = function(k){ return fd.get(k); };

    if(type === "add-trip"){
      var newTrip = {
        title: val("title"), destination: val("destination"),
        startDate: val("startDate"), endDate: val("endDate"),
        travelers: Number(val("travelers")) || 1,
        budgetTotal: Number(val("budgetTotal")) || 0,
        days: [], budgetItems: [],
        checklist: JSON.parse(JSON.stringify(DEFAULT_CHECKLIST)),
        review: { text:"", photoIds:[] },
        createdAt: new Date().toISOString()
      };
      db.collection("trips").add(newTrip).then(function(ref){
        ui.screen = "trip"; ui.tripId = ref.id; ui.tab = "itinerary";
        closeModal();
      });
      return;
    }
    if(type === "edit-trip"){
      var t = getTrip(ui.tripId);
      t.title = val("title"); t.destination = val("destination");
      t.startDate = val("startDate"); t.endDate = val("endDate");
      t.travelers = Number(val("travelers")) || 1;
      t.budgetTotal = Number(val("budgetTotal")) || 0;
      saveTrip(t); closeModal();
      return;
    }
    if(type === "food-reco"){
      food.region = val("region"); food.preference = val("preference");
      food.error = null; food.results = null; food.loading = true;
      render();
      if(!sampleNs){ food.loading=false; food.error="AI 추천 기능을 사용할 수 없어요."; render(); return; }
      var prompt = "여행 앱의 맛집 추천 기능이야. \"" + food.region + "\" 지역/근처에서 갈만한 음식점을 5곳 추천해줘." +
        (food.preference ? (" 선호: " + food.preference + ".") : "") +
        " 반드시 아래 JSON 배열 형식으로만 응답하고 다른 텍스트는 포함하지 마: " +
        '[{"name":"가게 이름","category":"음식 종류/특징 (짧게)","why":"추천 이유 (한 문장)"}]';
      sampleNs.json(prompt, { modelTier:"default" }).then(function(res){
        food.loading = false;
        food.results = Array.isArray(res) ? res : (res && Array.isArray(res.results) ? res.results : []);
        render();
      }).catch(function(err){
        food.loading = false;
        food.error = (err && err.code === "not_granted")
          ? "AI 추천 기능을 사용할 수 없어요."
          : "추천을 가져오지 못했어요. 잠시 후 다시 시도해주세요.";
        render();
      });
      return;
    }
    if(type === "add-day"){
      var trip2 = getTrip(ui.tripId);
      trip2.days = trip2.days || [];
      trip2.days.push({ date: val("date"), status: val("status"), summary: val("summary"), items: [] });
      trip2.days.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
      saveTrip(trip2); closeModal();
      return;
    }
    if(type === "edit-day"){
      var trip3 = getTrip(ui.tripId);
      var d = trip3.days[ui.modal.idx];
      d.date = val("date"); d.status = val("status"); d.summary = val("summary");
      trip3.days.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
      saveTrip(trip3); closeModal();
      return;
    }
    if(type === "add-item"){
      var trip4 = getTrip(ui.tripId);
      var day = trip4.days[ui.dayIdx];
      day.items = day.items || [];
      var kind4 = val("kind") === "label" ? "label" : "time";
      day.items.push({ kind: kind4, time: kind4==="time" ? val("timeValue") : val("labelValue"), text: val("text") });
      saveTrip(trip4); closeModal();
      return;
    }
    if(type === "edit-item"){
      var trip5 = getTrip(ui.tripId);
      var it = trip5.days[ui.dayIdx].items[ui.modal.idx];
      var kind5 = val("kind") === "label" ? "label" : "time";
      it.kind = kind5; it.time = kind5==="time" ? val("timeValue") : val("labelValue"); it.text = val("text");
      saveTrip(trip5); closeModal();
      return;
    }
    if(type === "add-budget"){
      var trip6 = getTrip(ui.tripId);
      trip6.budgetItems = trip6.budgetItems || [];
      trip6.budgetItems.push({ category: val("category"), amount: Number(val("amount"))||0, memo: val("memo") });
      saveTrip(trip6); closeModal();
      return;
    }
    if(type === "add-check"){
      var trip7 = getTrip(ui.tripId);
      trip7.checklist = trip7.checklist || [];
      trip7.checklist.push({ text: val("text"), done:false });
      saveTrip(trip7); closeModal();
      return;
    }
    if(type === "edit-review"){
      var trip8 = getTrip(ui.tripId);
      trip8.review = trip8.review || { photoIds:[] };
      trip8.review.text = val("text");
      saveTrip(trip8); closeModal();
      return;
    }
  });

  /* ---------------- init ---------------- */

  (function init(){
    render();
    if(!window.claude || !window.claude.use){ return; }
    window.claude.use("db").then(function(ns){
      db = ns;
      if(!db){ dbReady = false; dbState = "unavailable"; render(); return; }
      dbReady = true;
      db.collection("trips").onSnapshot(function(snap){
        debugInfo.snapshots++;
        debugInfo.lastSize = snap.size;
        debugInfo.lastFromCache = snap.metadata ? snap.metadata.fromCache : "?";
        debugInfo.lastAt = new Date().toLocaleTimeString("ko-KR");
        try{
          trips = snap.docs.map(function(doc){
            var raw = (typeof doc.data === "function" ? doc.data() : doc.data) || {};
            var data = JSON.parse(JSON.stringify(raw));
            data.id = doc.id;
            data.days = data.days || [];
            data.budgetItems = data.budgetItems || [];
            data.checklist = data.checklist || [];
            data.review = data.review || { text:"", photoIds:[] };
            return data;
          });
          debugInfo.mapError = null;
        } catch(mapErr){
          debugInfo.mapError = (mapErr && mapErr.message) ? mapErr.message : String(mapErr);
        }
        render();
      }, function(err){
        dbReady = false;
        dbState = (err && err.code) ? err.code : "unknown_error";
        render();
      });
    }).catch(function(){ dbReady = false; dbState = "unavailable"; render(); });
    window.claude.use("assets").then(function(ns){ assetsNs = ns; render(); });
    window.claude.use("sample").then(function(ns){ sampleNs = ns; render(); });
  })();
})();
</script>
